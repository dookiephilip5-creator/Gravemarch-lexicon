<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Offline Creator Engine</title>

<style>
/* =========================================================
   OFFLINE CREATOR ENGINE
   FOUNDATION BUILD v1.0
   © 2026
   Pure Offline HTML/CSS/JS
   No Frameworks
   No Cloud
========================================================= */

:root{
  --bg:#050607;
  --panel:#101316;
  --panel2:#15191d;
  --line:#2a3337;
  --mint:#67ffbf;
  --mintSoft:#2ee6a2;
  --crimson:#8f1025;
  --crimsonBright:#e02b46;
  --text:#e8f0ea;
  --muted:#7b8782;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

/* =========================================================
   LAYOUT
========================================================= */

.app{
  width:100%;
  height:100%;
  display:grid;
  grid-template-rows:58px 1fr 30px;
}

.topbar{
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 14px;
  background:#07090b;
  border-bottom:1px solid var(--line);
}

.statusbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  background:#07090b;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
}

.brand{
  font-weight:800;
  color:var(--mint);
  letter-spacing:.08em;
  white-space:nowrap;
}

.worldLabel{
  font-size:12px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.sidebarToggle{
  border:none;
  background:none;
  color:var(--crimsonBright);
  font-size:24px;
  cursor:pointer;
  padding:0;
}

.main{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:0 1fr;
  overflow:hidden;
  transition:.2s ease;
}

.main.open{
  grid-template-columns:320px 1fr;
}

.sidebar{
  overflow:auto;
  background:#090d10;
  border-right:1px solid var(--line);
  padding:12px;
}

.workspace{
  overflow:auto;
  padding:18px;
}

/* =========================================================
   PANEL
========================================================= */

.panel{
  width:100%;
  max-width:1100px;
  margin:auto;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:18px;
  box-shadow:0 0 40px rgba(0,0,0,.25);
}

.panel h1{
  margin-top:0;
  color:var(--mint);
}

/* =========================================================
   GROUPS
========================================================= */

.group{
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:12px;
  padding:10px;
  margin-bottom:10px;
}

.group h3{
  margin:0 0 10px;
  color:var(--mint);
  font-size:13px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

/* =========================================================
   FORMS
========================================================= */

button,
input,
textarea,
select{
  font:inherit;
}

button{
  width:100%;
  margin:4px 0;
  padding:10px 12px;
  background:#11161a;
  border:1px solid var(--line);
  color:var(--mint);
  border-radius:10px;
  cursor:pointer;
}

button:hover{
  border-color:var(--mint);
}

button.danger{
  border-color:var(--crimson);
  color:#ffdbe0;
  background:#19070a;
}

input,
textarea,
select{
  width:100%;
  margin:4px 0;
  padding:10px;
  background:#050708;
  border:1px solid var(--line);
  border-radius:10px;
  color:var(--text);
}

textarea{
  resize:vertical;
  line-height:1.8;
}

.manuscript{
  min-height:65vh;
  font-size:18px;
}

/* =========================================================
   CARDS
========================================================= */

.card{
  border:1px solid var(--line);
  background:var(--panel2);
  border-radius:12px;
  padding:12px;
  margin:10px 0;
}

.card b{
  color:var(--mint);
}

.alert{
  border-color:var(--crimson);
  color:#ffd8df;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

/* =========================================================
   ZEN MODE
========================================================= */

.zen .topbar,
.zen .statusbar,
.zen .sidebar{
  display:none;
}

.zen .main{
  grid-template-columns:1fr;
}

.zen .workspace{
  padding:0;
}

.zen .panel{
  max-width:none;
  min-height:100vh;
  border:0;
  border-radius:0;
}

/* =========================================================
   MOBILE FIX
========================================================= */

@media(max-width:800px){

  .main{
    display:block;
    position:relative;
  }

  .sidebar{
    position:fixed;
    top:58px;
    left:-88vw;
    width:82vw;
    max-width:340px;
    height:calc(100vh - 58px);
    z-index:100;
    transition:left .2s ease;
    box-shadow:0 0 40px rgba(0,0,0,.6);
  }

  .main.open .sidebar{
    left:0;
  }

  .workspace{
    width:100%;
    height:100%;
    padding:14px;
  }

  .panel{
    max-width:none;
    padding:14px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .manuscript{
    min-height:60vh;
    font-size:17px;
  }
}
</style>
</head>

<body>

<div class="app" id="app">

  <!-- TOPBAR -->

  <div class="topbar">
    <button class="sidebarToggle" onclick="toggleSidebar()">☰</button>

    <div class="brand">
      OFFLINE CREATOR ENGINE
    </div>

    <div class="worldLabel" id="worldLabel">
      No World Loaded
    </div>
  </div>

  <!-- MAIN -->

  <div class="main" id="main">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="group">
        <h3>Franchise Tree</h3>

        <input id="newWorldName" placeholder="New world name">

        <button onclick="createWorld()">
          Create World
        </button>

        <select id="worldSelect" onchange="loadWorld(this.value)"></select>

        <button class="danger" onclick="deleteWorld()">
          Delete Active World
        </button>
      </div>

      <div class="group">
        <h3>Workspace</h3>

        <button onclick="showModule('manuscript')">
          Manuscript Workspace
        </button>

        <button onclick="showModule('lore')">
          Lore Database
        </button>

        <button onclick="showModule('entries')">
          Entry Archive
        </button>

        <button onclick="showModule('characters')">
          Character Vault
        </button>

        <button onclick="showModule('chronology')">
          Chronology Matrix
        </button>

        <button onclick="showModule('diagnostics')">
          Diagnostics
        </button>

        <button onclick="showModule('reference')">
          Global Reference
        </button>
      </div>

      <div class="group">
        <h3>Forge Core</h3>

        <button onclick="extractCore()">
          Forge Core Extract
        </button>

        <input
          type="file"
          accept=".json"
          onchange="injectCore(event)"
        >

        <button onclick="saveWorld(false)">
          Manual Save
        </button>
      </div>

      <div class="group">
        <h3>Engine Governor</h3>

        <button onclick="toggleZen()">
          Zen Mode Toggle
        </button>
      </div>

    </aside>

    <!-- WORKSPACE -->

    <main class="workspace">
      <section class="panel" id="screen"></section>
    </main>

  </div>

  <!-- STATUS -->

  <div class="statusbar">
    <span id="saveStatus">
      Stable diagnostics online.
    </span>

    <span>
      © 2026 Offline Creator Engine
    </span>
  </div>

</div>

<script>
/* =========================================================
   OFFLINE CREATOR ENGINE
   FOUNDATION BUILD v1.0
========================================================= */

const ENGINE_VERSION = "1.0.0";
const MASTER_INDEX = "OCE_MASTER_INDEX";

let activeWorld = null;
let activeWorldId = null;
let currentModule = "manuscript";

/* =========================================================
   STORAGE
========================================================= */

function getIndex(){
  return JSON.parse(localStorage.getItem(MASTER_INDEX) || "[]");
}

function setIndex(index){
  localStorage.setItem(MASTER_INDEX, JSON.stringify(index));
}

function projectKey(id){
  return "OCE_PROJECT_" + id;
}

/* =========================================================
   WORLD TEMPLATE
========================================================= */

function blankWorld(name){

  return {

    meta:{
      engine:"Offline Creator Engine",
      version:ENGINE_VERSION,
      id:"oce_" + Date.now(),
      name:name || "Untitled World",
      createdAt:new Date().toISOString(),
      updatedAt:new Date().toISOString()
    },

    manifesto:"",

    manuscript:{
      activeChapter:"chapter_1",
      chapters:[
        {
          id:"chapter_1",
          title:"Chapter 1",
          body:""
        }
      ]
    },

    lore:[],
    entries:[],
    characters:[],
    chronology:[],
    diagnostics:[],

    worldState:{
      stability:100,
      laws:[]
    }
  };
}

/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar(){
  document.getElementById("main").classList.toggle("open");
}

/* =========================================================
   ZEN MODE
========================================================= */

function toggleZen(){
  document.body.classList.toggle("zen");
}

/* =========================================================
   CREATE WORLD
========================================================= */

function createWorld(){

  const input = document
    .getElementById("newWorldName");

  const name = input.value.trim();

  if(!name){
    alert("Enter a world name.");
    return;
  }

  const world = blankWorld(name);

  localStorage.setItem(
    projectKey(world.meta.id),
    JSON.stringify(world)
  );

  const index = getIndex();

  index.push({
    id:world.meta.id,
    name:world.meta.name,
    updatedAt:world.meta.updatedAt
  });

  setIndex(index);

  input.value = "";

  renderWorldList();

  loadWorld(world.meta.id);
}

/* =========================================================
   WORLD LIST
========================================================= */

function renderWorldList(){

  const select = document
    .getElementById("worldSelect");

  const index = getIndex();

  select.innerHTML = index.map(world => `
    <option value="${world.id}">
      ${escapeHTML(world.name)}
    </option>
  `).join("");
}

/* =========================================================
   LOAD WORLD
========================================================= */

function loadWorld(id){

  if(!id) return;

  const raw = localStorage.getItem(projectKey(id));

  if(!raw) return;

  activeWorld = JSON.parse(raw);
  activeWorldId = id;

  document.getElementById("worldLabel")
    .textContent = "World: " + activeWorld.meta.name;

  document.getElementById("worldSelect")
    .value = id;

  showModule(currentModule);
}

/* =========================================================
   SAVE WORLD
========================================================= */

function saveWorld(silent=true){

  if(!activeWorld) return;

  activeWorld.meta.updatedAt =
    new Date().toISOString();

  localStorage.setItem(
    projectKey(activeWorld.meta.id),
    JSON.stringify(activeWorld)
  );

  document.getElementById("saveStatus")
    .textContent = silent
    ? "Autosaved."
    : "Manual save complete.";
}

/* =========================================================
   DELETE WORLD
========================================================= */

function deleteWorld(){

  if(!activeWorld) return;

  if(!confirm(
    "Delete active world from browser storage?"
  )) return;

  localStorage.removeItem(
    projectKey(activeWorld.meta.id)
  );

  const next = getIndex().filter(
    world => world.id !== activeWorld.meta.id
  );

  setIndex(next);

  activeWorld = null;
  activeWorldId = null;

  renderWorldList();

  welcomeScreen();
}

/* =========================================================
   MODULE SWITCH
========================================================= */

function showModule(module){

  currentModule = module;

  if(!activeWorld && module !== "reference"){
    welcomeScreen();
    return;
  }

  const modules = {
    manuscript:renderManuscript,
    lore:renderLore,
    entries:renderEntries,
    characters:renderCharacters,
    chronology:renderChronology,
    diagnostics:renderDiagnostics,
    reference:renderReference
  };

  modules[module]();
}

/* =========================================================
   WELCOME
========================================================= */

function welcomeScreen(){

  document.getElementById("screen").innerHTML = `
    <h1>A Tool for the Last True Creators.</h1>

    <div class="card">
      This is the clean offline foundation build.
      Create a world to begin.
    </div>

    <div class="card">
      <b>Status:</b>
      No frameworks. No cloud. No external requests.
    </div>
  `;
}

/* =========================================================
   MANUSCRIPT
========================================================= */

function renderManuscript(){

  const chapters =
    activeWorld.manuscript.chapters;

  const chapter =
    chapters.find(c =>
      c.id === activeWorld.manuscript.activeChapter
    ) || chapters[0];

  document.getElementById("screen").innerHTML = `
    <h1>Manuscript Workspace</h1>

    <select onchange="switchChapter(this.value)">
      ${chapters.map(c => `
        <option
          value="${c.id}"
          ${c.id===chapter.id ? "selected" : ""}
        >
          ${escapeHTML(c.title)}
        </option>
      `).join("")}
    </select>

    <input
      value="${escapeHTML(chapter.title)}"
      oninput="updateChapterTitle(this.value)"
      placeholder="Chapter title"
    >

    <textarea
      class="manuscript"
      oninput="updateChapterBody(this.value)"
      placeholder="Begin writing..."
    >${escapeHTML(chapter.body)}</textarea>

    <button onclick="addChapter()">
      Add Chapter
    </button>

    <button class="danger" onclick="deleteChapter()">
      Delete Chapter
    </button>

    <button onclick="exportManuscript()">
      Export Manuscript TXT
    </button>

    <div class="small">
      Chapters: ${chapters.length}
    </div>
  `;
}

function switchChapter(id){

  activeWorld.manuscript.activeChapter = id;

  saveWorld();

  renderManuscript();
}

function addChapter(){

  const count =
    activeWorld.manuscript.chapters.length + 1;

  const chapter = {
    id:"chapter_" + Date.now(),
    title:"Chapter " + count,
    body:""
  };

  activeWorld.manuscript.chapters.push(chapter);

  activeWorld.manuscript.activeChapter =
    chapter.id;

  saveWorld();

  renderManuscript();
}

function deleteChapter(){

  const chapters =
    activeWorld.manuscript.chapters;

  if(chapters.length <= 1){
    alert("At least one chapter must remain.");
    return;
  }

  if(!confirm("Delete current chapter?")) return;

  const current =
    activeWorld.manuscript.activeChapter;

  activeWorld.manuscript.chapters =
    chapters.filter(c => c.id !== current);

  activeWorld.manuscript.activeChapter =
    activeWorld.manuscript.chapters[0].id;

  saveWorld();

  renderManuscript();
}

function updateChapterTitle(value){

  const chapter =
    activeWorld.manuscript.chapters.find(
      c => c.id === activeWorld.manuscript.activeChapter
    );

  chapter.title = value;

  saveWorld();
}

function updateChapterBody(value){

  const chapter =
    activeWorld.manuscript.chapters.find(
      c => c.id === activeWorld.manuscript.activeChapter
    );

  chapter.body = value;

  saveWorld();
}

function exportManuscript(){

  const text =
    activeWorld.manuscript.chapters
      .map(ch => `${ch.title}\n\n${ch.body}`)
      .join("\n\n---\n\n");

  const blob = new Blob([text],{
    type:"text/plain"
  });

  const a = document.createElement("a");

  a.href = URL.createObjectURL(blob);

  a.download =
    activeWorld.meta.name.replace(/\s+/g,"_")
    + "_manuscript.txt";

  a.click();

  URL.revokeObjectURL(a.href);
}

/* =========================================================
   SIMPLE MODULES
========================================================= */

function renderLore(){
  renderSimpleModule(
    "Lore Database",
    "lore",
    ["title","type","body"]
  );
}

function renderEntries(){
  renderSimpleModule(
    "Entry Archive",
    "entries",
    ["title","type","tone","body"]
  );
}

function renderCharacters(){
  renderSimpleModule(
    "Character Vault",
    "characters",
    ["name","profile","psyche","history"]
  );
}

function renderChronology(){
  renderSimpleModule(
    "Chronology Matrix",
    "chronology",
    ["title","marker","chapter","body"]
  );
}

/* =========================================================
   GENERIC MODULE
========================================================= */

function renderSimpleModule(title,key,fields){

  document.getElementById("screen").innerHTML = `
    <h1>${title}</h1>

    <div class="grid">
      ${fields.map(field => `
        <input
          id="field_${field}"
          placeholder="${field}"
        >
      `).join("")}
    </div>

    <button onclick='addItem("${key}",${JSON.stringify(fields)})'>
      Add Entry
    </button>

    ${
      activeWorld[key].map((item,index)=>`
        <div class="card">
          <b>
            ${escapeHTML(
              item.title ||
              item.name ||
              "Untitled"
            )}
          </b>

          <p>
            ${escapeHTML(
              item.body ||
              item.profile ||
              item.psyche ||
              item.history ||
              ""
            )}
          </p>

          <button onclick='sendToManuscript("${key}",${index})'>
            Send to Manuscript
          </button>

          <button class="danger" onclick='removeItem("${key}",${index})'>
            Delete
          </button>
        </div>
      `).join("")
    }
  `;
}

function addItem(key,fields){

  const item = {
    id:key + "_" + Date.now()
  };

  fields.forEach(field => {
    item[field] =
      document.getElementById("field_" + field).value;
  });

  activeWorld[key].push(item);

  saveWorld();

  showModule(currentModule);
}

function removeItem(key,index){

  activeWorld[key].splice(index,1);

  saveWorld();

  showModule(currentModule);
}

function sendToManuscript(key,index){

  const item = activeWorld[key][index];

  const text =
    "\n\n" +
    (
      item.body ||
      item.profile ||
      item.psyche ||
      item.history ||
      item.title ||
      item.name ||
      ""
    );

  const chapter =
    activeWorld.manuscript.chapters.find(
      c => c.id === activeWorld.manuscript.activeChapter
    );

  chapter.body += text;

  saveWorld();

  alert("Sent to manuscript.");
}

/* =========================================================
   DIAGNOSTICS
========================================================= */

function renderDiagnostics(){

  const alerts = [];

  if(activeWorld.lore.length===0){
    alerts.push("No lore entries created.");
  }

  if(activeWorld.characters.length===0){
    alerts.push("No characters created.");
  }

  document.getElementById("screen").innerHTML = `
    <h1>Diagnostics / Law Matrix</h1>

    <div class="card">
      <b>World Stability:</b>
      ${activeWorld.worldState.stability}%
    </div>

    ${
      alerts.length
      ? alerts.map(a=>`
        <div class="card alert">
          ⚠ ${escapeHTML(a)}
        </div>
      `).join("")
      : `
        <div class="card">
          Stable foundation.
        </div>
      `
    }
  `;
}

/* =========================================================
   REFERENCE
========================================================= */

function renderReference(){

  document.getElementById("screen").innerHTML = `
    <h1>Global Reference Vault</h1>

    <div class="card">
      Dictionary/thesaurus integration arrives in
      future foundation builds.
    </div>
  `;
}

/* =========================================================
   EXPORT / IMPORT
========================================================= */

function extractCore(){

  if(!activeWorld){
    alert("No active world.");
    return;
  }

  saveWorld();

  const blob = new Blob(
    [JSON.stringify(activeWorld,null,2)],
    {type:"application/json"}
  );

  const a = document.createElement("a");

  a.href = URL.createObjectURL(blob);

  a.download =
    activeWorld.meta.name.replace(/\s+/g,"_")
    + ".oce.json";

  a.click();

  URL.revokeObjectURL(a.href);
}

function injectCore(event){

  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = () => {

    try{

      const data = JSON.parse(reader.result);

      if(!data.meta || !data.meta.name){
        throw Error("Invalid save.");
      }

      data.meta.id =
        "oce_" + Date.now();

      data.meta.updatedAt =
        new Date().toISOString();

      localStorage.setItem(
        projectKey(data.meta.id),
        JSON.stringify(data)
      );

      const index = getIndex();

      index.push({
        id:data.meta.id,
        name:data.meta.name,
        updatedAt:data.meta.updatedAt
      });

      setIndex(index);

      renderWorldList();

      loadWorld(data.meta.id);

    }catch(err){

      alert("Forge Core Inject failed.");

    }
  };

  reader.readAsText(file);
}

/* =========================================================
   AUTOSAVE
========================================================= */

setInterval(()=>{
  if(activeWorld){
    saveWorld();
  }
},60000);

window.addEventListener("beforeunload",()=>{
  if(activeWorld){
    saveWorld();
  }
});

/* =========================================================
   UTILS
========================================================= */

function escapeHTML(str){

  return String(str || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

/* =========================================================
   BOOT
========================================================= */

function boot(){

  renderWorldList();

  const index = getIndex();

  if(index[0]){
    loadWorld(index[0].id);
  }else{
    welcomeScreen();
  }
}

boot();
</script>

</body>
</html>
